name: meme poster

on:
  schedule:
    - cron: "0/5 * * * *"
  workflow_dispatch:        # lets you run it manually from the Actions tab

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests feedparser

      - name: Reddit reachability test
        run: |
          curl -sS -o /dev/null -w "reddit returned: %{http_code}\n" \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/136.0.0.0 Safari/537.36" \
            -H "accept-language: en-US,en;q=0.9" \
            "https://www.reddit.com/r/dankmemes/top/.rss?t=day&limit=50"

      - name: Run bot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          STATUS_WEBHOOK_URL: ${{ secrets.STATUS_WEBHOOK_URL }}
        run: python post_meme.py
